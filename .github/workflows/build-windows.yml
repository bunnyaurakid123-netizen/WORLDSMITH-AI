name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build one-file Windows executable
        run: python -m PyInstaller --noconfirm --clean worldsmith.spec
      - name: Verify executable exists
        shell: pwsh
        run: if (!(Test-Path 'dist/WorldSmithAI.exe')) { throw 'WorldSmithAI.exe was not produced' }
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSmithAI-windows
          path: dist/WorldSmithAI.exe
