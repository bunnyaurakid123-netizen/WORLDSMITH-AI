name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name WorldSmithAI run_worldsmith.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSmithAI-windows
          path: dist/WorldSmithAI/
