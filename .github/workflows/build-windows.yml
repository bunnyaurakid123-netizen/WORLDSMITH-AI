name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: worldsmith-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Compile check
        run: python -m compileall -q worldsmith

      - name: Build single-file EXE
        run: python -m PyInstaller --noconfirm --clean worldsmith.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/WorldSmithAI.exe')) { throw 'WorldSmithAI.exe was not created' }
          Get-Item 'dist/WorldSmithAI.exe' | Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WorldSmithAI-windows
          path: dist/WorldSmithAI.exe
          if-no-files-found: error
