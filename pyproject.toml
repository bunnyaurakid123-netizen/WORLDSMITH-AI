[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsmith-ai"
version = "0.2.0"
description = "Standalone AI-powered Minecraft Java world editor and generator"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "PyOpenGL>=3.1.7",
  "amulet-core>=1.9.43,<2.0",
]

[project.scripts]
worldsmith = "worldsmith.app:main"

[tool.setuptools.packages.find]
include = ["worldsmith*"]

[tool.pytest.ini_options]
pythonpath = ["."]
